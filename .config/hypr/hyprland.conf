# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
# source = ~/.config/hypr/monitors/tokyo.conf
# source = ~/.config/hypr/monitors/us-s.conf
source = ~/.config/hypr/monitors/us-scaled.conf
# source = ~/.config/hypr/monitors/us-m.conf
# source = ~/.config/hypr/monitors/us-fullhd-hack.conf
# source = ~/.config/hypr/monitors/us-library.conf
# source = ~/.config/hypr/monitors/us-library-small.conf
## only with laptop
# monitor=eDP-1,preferred,0x0,1.5
## default
monitor=,preferred,0x0,auto

workspace=5,monitor:HDMI-A-1,default:true

# Color scheme - Source a file (multi-file configs)
source = ~/.config/hypr/rosepine-moon.conf

# Some default env vars.
env = XCURSOR_SIZE,24

env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_CURRENT_SESSION,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = LIBSEAT_BACKEND,logind
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = WINIT_UNIX_BACKEND,x11
env = ZWP_TEXT_INPUT_V1_PREEDIT_STYLE_NONE, 1

env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE=fcitx
env = GLFW_IM_MODULE=ibus

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
exec-once = fcitx5
exec-once = swaync
exec-once = waybar
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = fusuma
exec-once = wlsunset -S 05:30 -s 22:00
exec-once = hyprswitch init --show-title --size-factor 5.5 --workspaces-per-row 5

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 0
    gaps_out = 1
    border_size = 2
    col.active_border = $rose $pine $love $iris 90deg
    col.inactive_border = 0x00000000

    layout = dwindle
}

decoration {
    rounding = 10

    blur {
      enabled = false
      # size = 3
    }

    shadow {
      enabled = false
    }

    # dim_inactive = true
    # dim_strength = 0.03
}

animations {
    enabled = false

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    # animation = windows, 1, 7, myBezier
    # animation = windowsOut, 1, 7, default, popin 80%
    # animation = border, 1, 10, default
    # animation = borderangle, 1, 8, default
    # animation = fade, 1, 7, default
    # animation = workspaces, 1, 6, default
    animation = windows, 1, 0.25, default
    animation = border, 1, 0.25, default
    animation = borderangle, 1, 0.25, default
    animation = fade, 1, 0.25, default
    animation = workspaces, 1, 0.25, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = true
    workspace_swipe_fingers = 4
}

group {
    col.border_active = $rose $pine $love $iris 90deg
    col.border_inactive = $muted
    groupbar {
      col.active = $rose
      col.inactive = $muted
      gradients = false
      render_titles = false
      height = 1
    }
}

misc {
    focus_on_activate = 1
    # Lock
    allow_session_lock_restore = true
    vfr = true
    disable_hyprland_logo = false # I'm used to the black wallpaper
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

xwayland {
  use_nearest_neighbor = false
  # force_zero_scaling = true
}

binds {
  scroll_event_delay = 0
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

# Example windowrule v2
windowrulev2 = bordercolor rgb(31748f), fullscreen:1
windowrulev2 = opacity 0.8, class:(foot), floating:1
# windowrulev2 = stayfocused,  class:(pinentry-)(.*) # fix pinentry losing focus

# Keybinds
source = ~/.config/hypr/bind.conf

